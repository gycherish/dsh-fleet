[workspace]
name = "dsh-fleet"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# Node is pinned to the same range the DeepSeek Harness workspace uses. The
# node plugin is loaded into the dsh process, so building it against a
# different major than the one that will run it is a real risk, not a
# formality.
#
# PostgreSQL is here so the development loop needs no container. Docker remains
# the supported DEPLOYMENT, and deploy/docker-compose.yml is still the
# reference for it; this is only about not making `go run` wait on a daemon.
#
# Go is deliberately NOT managed here. It is already installed, and pinning a
# second copy through conda would leave two toolchains disagreeing about which
# one built the binary under test.
[dependencies]
nodejs = ">=26.6.0,<26.7"
pnpm = ">=11.21.0,<12"
postgresql = ">=18,<19"

# ── the dsh node plugin ──────────────────────────────────────────────────────

[tasks]
install = { cmd = "pnpm install", cwd = "dsh" }
build = { cmd = "pnpm run build", cwd = "dsh", depends-on = ["install"] }
typecheck = { cmd = "pnpm exec tsc -p tsconfig.json --noEmit", cwd = "dsh", depends-on = ["install"] }
# Runs against lib/, so build first. No test framework: node --test is enough
# for the handful of pure functions worth pinning here.
test = { cmd = "node --test test/*.test.mjs", cwd = "dsh", depends-on = ["build"] }

# ── mobile end-to-end ────────────────────────────────────────────────────────
#
# These drive real engines — WebKit for the iPhone profile, Chromium for the
# Pixel — against a stack you already brought up. They do not start one: the
# flows need PostgreSQL, the control plane, and a connected node, and a fixture
# that owned all three would be the part that breaks.
#
# Point DSHF_BASE_URL at the stack, then `pixi run e2e`.

[tasks.e2e-install]
cmd = "pnpm install && pnpm exec playwright install chromium webkit"
cwd = "test/e2e"
description = "Install Playwright and its browser builds (run once)."
env = { PLAYWRIGHT_BROWSERS_PATH = ".devdata/playwright" }

[tasks.e2e]
cmd = "pnpm exec playwright test"
cwd = "test/e2e"
description = "Run the mobile-viewport checks against a running control plane."
env = { PLAYWRIGHT_BROWSERS_PATH = ".devdata/playwright" }

# Interactive: open a real window emulating a handset and click around in it.
# WebKit for the iPhone profile and Chromium for the Pixel, which is what those
# devices actually run — so a Safari-only layout bug shows up here.

[tasks.phone]
args = [{ arg = "url", default = "http://127.0.0.1:8080" }]
cmd = "pnpm exec playwright open --device='iPhone 14' {{ url }}"
cwd = "test/e2e"
description = "Open the console in an emulated iPhone (WebKit)."
env = { PLAYWRIGHT_BROWSERS_PATH = ".devdata/playwright" }

[tasks.phone-android]
args = [{ arg = "url", default = "http://127.0.0.1:8080" }]
cmd = "pnpm exec playwright open --device='Pixel 7' {{ url }}"
cwd = "test/e2e"
description = "Open the console in an emulated Pixel (Chromium)."
env = { PLAYWRIGHT_BROWSERS_PATH = ".devdata/playwright" }

# ── local PostgreSQL for development ─────────────────────────────────────────
#
# Port 5433, not 5432, so this never collides with a system PostgreSQL. Trust
# auth is fine here and only here: the cluster listens on loopback and holds
# nothing but development rows.

# These are deliberately independent, with no `depends-on` and no `outputs`.
# `outputs` makes pixi fingerprint the project tree, which walks
# dsh/node_modules and dies on pnpm's nested symlinks; and initdb is not
# idempotent, so chaining it ahead of every start turns a second `pg-start`
# into an error. Run them in order once, then only pg-start/pg-stop.

[tasks.pg-init]
cmd = "initdb -D .devdata/pg -U dshfleet --auth=trust --encoding=UTF8"
description = "Create the development cluster (run once)."

# The redirection is load-bearing on Windows: the postgres child inherits
# pg_ctl's stdout, so leaving it attached to the task runner's pipe means the
# pipe never closes and `pixi run pg-start` hangs forever even though the
# server came up fine. Sending it to a file breaks the inheritance.
[tasks.pg-start]
cmd = "pg_ctl -D .devdata/pg -l .devdata/pg.log -o \"-p 5433\" -w start > .devdata/pg-ctl.log 2>&1"
description = "Start the development cluster on port 5433."

[tasks.pg-stop]
cmd = "pg_ctl -D .devdata/pg -m fast stop"
description = "Stop the development cluster."

[tasks.pg-create]
cmd = "createdb -h 127.0.0.1 -p 5433 -U dshfleet dshfleet"
description = "Create the dshfleet database (run once, after pg-start)."

[tasks.pg-psql]
cmd = "psql -h 127.0.0.1 -p 5433 -U dshfleet dshfleet"
description = "Open a psql shell against the development database."

# First-time setup, in this order:
#   pixi run pg-init && pixi run pg-start && pixi run pg-create
# Afterwards only pg-start / pg-stop are needed.

