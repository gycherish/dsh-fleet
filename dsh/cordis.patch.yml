# The dsh-fleet node layer.
#
# Installing this package into a profile (`dsh plugin --profile web add …`)
# activates this patch automatically, because the manifest declares
# `dsh.bundle`. The row is ENABLED but unconfigured, so a plain install adds a
# plugin that connects to nothing and changes nothing about how `dsh web`
# behaves.
#
# Enabled rather than disabled on purpose: a disabled row does not appear in
# Settings → Plugins, and that page is the only place someone can configure it.
# A plugin that hides until it is configured cannot be configured.
#
# No values are written here either, and in particular no `!!js process.env`
# ones. A deferred expression is re-read on every load, so it would silently
# win against whatever was typed into the settings form. The plugin reads those
# same variables itself as a fallback, which keeps a container working while
# leaving the form authoritative.

- insert:
    - id: fleet-node
      name: '@dsh-fleet/node'

# A remote browser cannot answer a native directory chooser: it opens on THIS
# machine's desktop, and `host.pickDirectory` is a privileged method the fleet
# carrier refuses besides. The auto picker selects that native backend on any
# machine with a display, so "add workspace" fails from a phone.
#
# Swapping it takes two rows, not one: an id-targeted patch treats `name` as an
# ASSERTION that it is editing the row it thinks it is, and skips itself with a
# "name mismatch" warning when it differs. So disable the composed row and
# mount the browse backend beside it.
#
# Drop both rows from your profile patch if this node is only ever driven from
# its own desktop.
- id: directory-picker
  disabled: true

- insert:
    - id: fleet-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
