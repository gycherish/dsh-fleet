# The dsh-fleet node layer.
#
# Installing this package into a profile (`dsh plugin --profile web add …`)
# activates this patch automatically, because the manifest declares
# `dsh.bundle`. The row stays INERT until the deployment supplies a control
# plane URL, so a plain install never changes how `dsh web` behaves.
#
# Every value comes from the environment rather than being written here: a
# node token is a credential, and this file is checked into the profile
# directory alongside ordinary configuration.
#
# To override any of it, restate the whole `config` in the profile's own
# cordis.patch.yml — a patch replaces the targeted row's complete config
# rather than merging into it.

- insert:
    - id: fleet-node
      name: '@dsh-fleet/node'
      # No URL configured means this deployment is not part of a fleet.
      disabled: !!js !process.env.DSH_FLEET_URL
      config:
        url: !!js process.env.DSH_FLEET_URL ?? ''
        nodeId: !!js process.env.DSH_FLEET_NODE_ID ?? ''
        token: !!js process.env.DSH_FLEET_TOKEN ?? ''
        label: !!js process.env.DSH_FLEET_LABEL

# A remote browser cannot answer a native directory chooser: it opens on THIS
# machine's desktop, and `host.pickDirectory` is a privileged method the fleet
# carrier refuses besides. The auto picker selects that native backend on any
# machine with a display, so "add workspace" fails from a phone.
#
# Swapping it takes two rows, not one: an id-targeted patch treats `name` as an
# ASSERTION that it is editing the row it thinks it is, and skips itself with a
# "name mismatch" warning when it differs. So disable the composed row and
# mount the browse backend beside it.
#
# Drop both rows from your profile patch if this node is only ever driven from
# its own desktop.
- id: directory-picker
  disabled: true

- insert:
    - id: fleet-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
