<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
<title>Sign in · dsh-fleet</title>
<style>
body { display: grid; place-items: center; }
main { width: 100%; max-width: 21rem; }
.brand { font-size: 1.05rem; margin-bottom: 1.5rem; justify-content: center; }
form {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
  padding: 1.4rem; display: flex; flex-direction: column; gap: .9rem;
  box-shadow: 0 1px 2px var(--shadow), 0 10px 30px var(--shadow);
}
h1 { font-size: 1.05rem; margin: 0; }
.sub { color: var(--muted); font-size: .85rem; margin: -.55rem 0 .2rem; }
label { display: flex; flex-direction: column; gap: .3rem; font-size: .78rem; color: var(--muted); }
input {
  font: inherit; padding: .6rem .7rem; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--sunk); color: var(--ink);
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { padding: .6rem; text-align: center; }
.error {
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  border: 1px solid var(--danger); color: var(--danger);
  border-radius: 8px; padding: .5rem .7rem; font-size: .82rem;
}
</style>
</head>
<body>
<main>
  <p class="brand"><span class="mark" aria-hidden="true">dF</span> dsh-fleet</p>
  <form method="post" action="/_fleet/login" autocomplete="on">
    <h1>Sign in</h1>
    <p class="sub">One console for every machine you run dsh on.</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
